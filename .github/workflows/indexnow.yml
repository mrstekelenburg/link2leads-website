# Meldt na elke deploy alle pagina's uit de sitemap bij IndexNow.
# IndexNow wordt gebruikt door Bing (en daarmee ChatGPT-zoeken), Yandex,
# Seznam en Naver. Nieuwe en gewijzigde pagina's worden zo binnen uren
# opgepakt in plaats van na dagen of weken.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wachten tot Vercel klaar is met deployen
        run: sleep 150
      - name: Pagina's melden bij IndexNow
        run: |
          KEY="17c519a66898f1c79c4a3d519acbf9fc"
          HOST="www.link2leads.nl"
          URLS=$(grep -oE '<loc>[^<]+' sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}' > body.json
          echo "Aantal pagina's: $(jq '.urlList | length' body.json)"
          CODE=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow antwoord: $CODE"; cat resp.txt || true
          # 200 en 202 betekenen geaccepteerd
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ]
